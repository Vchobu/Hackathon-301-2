[project]
name = "hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vadym Chobu", email = "vadym.chobu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.6.0",
    "marimo>=0.25.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
hackathon = "hackathon:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
